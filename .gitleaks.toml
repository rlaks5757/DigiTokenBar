# gitleaks 설정 — CI(secret-scan)에서 사용.
#
# 기본 룰셋을 그대로 쓰되(extend), 오탐 하나만 좁게 허용한다.
# 파일 단위 예외는 두지 않는다 — 그 파일에 나중에 진짜 비밀이 들어와도 조용히 통과하기 때문이다.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = """
  Claude 구독 플랜의 rate limit 티어 식별자. 비밀이 아니라 공개된 플랜 등급 이름이다.
  앱은 이 문자열 끝의 배수 토큰("20x"/"5x")을 파싱해 "Max 20x" 같은 표시용 라벨을 만든다
  (Models.swift:267 주석, :290 tierMultiplier). Keychain 자격증명 JSON 에 함께 들어 있어
  파싱 테스트가 실제 형태를 재현하느라 리터럴로 등장한다.

  엔트로피(3.57)가 기본 generic-api-key 임계를 넘겨 오탐이 났다.
  같은 JSON 안의 accessToken 은 "tok"/"account-tok" 같은 더미라 이 예외와 무관하다.
  """
  regexes = ['''default_claude(_ai|_pro|_max_\d+x)?''']
